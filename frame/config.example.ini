# vrc-wrist-notifier (Steam Frame 側) の設定サンプル
# 待ち受けるポート（Windows 側の frame_port と同じにする）
listen_port = 39570
listen_address = 0.0.0.0
# 受け付ける送り元: lan（家の LAN だけ）/ any / IP をカンマ区切り
allow_from = lan
# 表示場所: view（視界の少し下）/ left_wrist / right_wrist（コントローラーの手首あたり）
anchor = view
# 1 件を表示する秒数
duration_s = 4
# カードの幅（メートル）
width_m = 0.30
# view のときの距離と高さ（メートル）
distance_m = 0.8
offset_y_m = -0.18
# 表示待ちの最大件数（あふれた分は捨てる）
max_queue = 8
font = Noto Sans CJK JP
# ダッシュボードに「入退室の履歴」のパネルを出す（true / false）
history_panel = true
# パネルの幅（メートル）
panel_width_m = 2.6
# 履歴を置く場所（空なら ~/.local/state/vrc-wrist-notifier）。人の名前が入るので Frame の中だけに置かれます
history_dir =
