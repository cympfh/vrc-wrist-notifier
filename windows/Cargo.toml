[package]
name = "vrc-wrist-notifier"
version = "0.5.1"
edition = "2021"
license = "MIT"
description = "VRChat のログを読んで Steam Frame の wrist-toast に通知を送る（Windows 側、システムトレイ常駐）"

[lib]
name = "vwn"
path = "src/lib.rs"

[[bin]]
name = "vrc-wrist-notifier"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
